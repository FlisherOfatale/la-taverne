name: Release

# Pushing a version tag (v1.0.0, v1.2.3-beta...) packages the addon and uploads it to
# CurseForge and GitHub Releases. A tag with "alpha" or "beta" in it goes up as that type.
# Plain 0.x tags (v0.31.1) are the private pre-launch builds: skipped. 0.x alphas and
# betas (v0.31.2-alpha) are published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ !startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag matches the TOC version
        run: |
          toc=$(grep -m1 '^## Version:' LaTaverne/LaTaverne.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the TOC version $toc"
            exit 1
          fi
          if ! grep -q "^# La Taverne $tag\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md isn't the $tag notes"
            exit 1
          fi

      - uses: BigWigsMods/packager@v2
